name: NestJS Self-Hosted Deploy (PM2)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      # ----------------------------
      # 1. Checkout Code
      # ----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------
      # 2. Setup Node.js
      # ----------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ----------------------------
      # 3. Create .env file
      # ----------------------------
      - name: Create .env file
        run: |
          cat <<EOF > .env
          NODE_ENV=production
          PORT=${{ vars.PORT }}
          JWT_SECRET=${{ vars.JWT_SECRET }}
          JWT_EXPIRY=${{ vars.JWT_EXPIRY }}
          MONGODB_URI=${{ vars.MONGODB_URI }}
          GLOBAL_PREFIX=${{ vars.GLOBAL_PREFIX }}
          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          MAILJET_API_KEY=${{ vars.MAILJET_API_KEY }}
          MAILJET_API_SECRET=${{ vars.MAILJET_API_SECRET }}
          MAIL_FROM_ADDRESS=${{ vars.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME }}
          EOF

      # ----------------------------
      # 4. Install Dependencies
      # ----------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------
      # 5. Build NestJS
      # ----------------------------
      - name: Build application
        run: npm run build

      # ----------------------------
      # 6. Run Tests (optional)
      # ----------------------------
      - name: Run tests
        run: npm test

      # ----------------------------
      # 8. Deploy with PM2
      # ----------------------------
      - name: Deploy with PM2
        run: |
          pm2 reload nest-api || pm2 start dist/main.js --name nest-api
          pm2 save
